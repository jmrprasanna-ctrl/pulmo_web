<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULMO TECHNOLOGIES - Login</title>
<link rel="stylesheet" href="../assets/extracted/pages/login.inline-style-1.css?v=20260608p02">
</head>
<body>

<div class="axis-loader-overlay is-active" id="axisLoadingOverlay" aria-hidden="false">
    <div class="axis-loader-card" role="status" aria-live="polite">
        <div class="axis-loader-logo-wrap">
            <img src="../assets/images/axis-loading-logo.png" alt="AXIS CMS SYSTEM">
        </div>
        <div class="axis-loader-spinner" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>
        <p class="axis-loader-title" id="axisLoadingTitle">Starting AXIS CMS SYSTEM...</p>
    </div>
</div>

<div class="login-container">
    <div class="company-logo-wrap is-hidden" id="companyLogoWrap" aria-hidden="true">
        <img src="" alt="Company Logo" id="companyLogo">
    </div>
    <h2>User Login</h2>
    <p class="login-meta" id="loginCompanyName">AXIS CMS SYSTEM</p>
    <form id="loginForm" method="post" autocomplete="off" novalidate>
        <div class="field saved-company-code-wrap" id="savedCompanyCodeWrap" hidden aria-hidden="true">
            <label for="savedCompanyCodeSelect">Saved Company Codes</label>
            <select id="savedCompanyCodeSelect">
                <option value="">Recent company codes</option>
            </select>
        </div>
        <div class="field">
            <label for="companyCode">Company Code</label>
            <input
                type="text"
                id="companyCode"
                name="company_code"
                placeholder="Company Code"
                autocomplete="off"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                required
            >
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input
                type="text"
                id="email"
                name="email"
                placeholder="Email"
                autocomplete="off"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                required
            >
        </div>
        <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >
                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                    aria-label="Show password"
                    aria-pressed="false"
                >
                    <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M2 12C3.9 8 7.4 5.5 12 5.5C16.6 5.5 20.1 8 22 12C20.1 16 16.6 18.5 12 18.5C7.4 18.5 3.9 16 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                </button>
            </div>
        </div>
        <button class="login-btn" id="loginBtn" type="submit">Login</button>
    </form>
    <a href="forgot-password.html" class="forgot-password" id="forgotPasswordLink">Forgot password?</a>
</div>

<script src="../assets/js/api.js?v=20260522p01"></script>
<script src="../assets/extracted/pages/login.inline-script-1.js?v=20260608p01"></script>

</body>
</html>
