<body>
<div class="sidebar">
    <div class="logo">
        <img src="../../assets/images/logo.png" alt="Logo">
        <span>PULMO TECHNOLOGIES</span>
    </div>
    <ul class="nav-links">
        <li><a href="../dashboard.html">Dashboard</a></li>
        <li><a href="../products/product-list.html">Products</a></li>

        <li><a href="../analytics/sales-chart.html">Analytics</a></li>
    </ul>
</div>

<div class="main-content">
    <header class="page-head">
        <h2>Breakdown</h2>
        <a class="icon-btn" href="../dashboard.html" aria-label="Back to dashboard" title="Back to dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14.5 6.5 9 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
    </header>

    <div class="form-container">
        <div class="form-actions">
            <div class="action-row">
                <a class="icon-btn" href="add-service.html?mode=breakdown" id="addBreakdownBtn" aria-label="Create breakdown" title="Create breakdown">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </a>
            </div>
            <div class="date-filter">
                <label for="filterBreakdownMonth">Month</label>
                <input type="month" id="filterBreakdownMonth">
            </div>
            <input type="text" id="breakdownSearch" class="search-inline" placeholder="Search Customer, Machine, Technician, Counter, Comment">
        </div>

        <div class="summary-row">
            <div class="summary-box">
                <div class="label">Filtered Breakdowns</div>
                <div class="value" id="breakdownCount">0</div>
            </div>
            <div class="summary-box">
                <div class="label">Assigned Breakdowns</div>
                <div class="value" id="assignedBreakdownCount">0</div>
            </div>
            <div class="summary-box">
                <div class="label">Unassigned Breakdowns</div>
                <div class="value" id="unassignedBreakdownCount">0</div>
            </div>
        </div>

        <div class="card" style="margin-top:12px;">
            <table id="breakdownTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Machine</th>
                        <th>Technician</th>
                        <th>Counter</th>
                        <th>Comment</th>
                    </tr>
                </thead>
                <tbody id="breakdownTableBody"></tbody>
            </table>
        </div>
    </div>
</div>
